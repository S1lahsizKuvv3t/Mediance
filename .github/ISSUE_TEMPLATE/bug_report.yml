name: Bug report
description: Report a reproducible problem in Mediance
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please avoid sharing account information, full lyrics, or private screenshots.
  - type: input
    id: version
    attributes:
      label: Mediance version
      placeholder: 0.9.0-beta.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, build number if known
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Media application
      description: Spotify, YouTube Music in Chrome, Edge, or another source
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start playback in...
        2. Open...
        3. Click...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Sometimes
        - Happened once
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Display scale, monitor layout, audio devices, or short privacy-reviewed log lines can help.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed private information from anything attached.
          required: true
